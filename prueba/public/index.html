<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket Avanzado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla Inicial con Selección de Nombre e Idioma Dinámico -->
    <div id="modal-login" class="modal">
        <div class="modal-contenido">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu Nickname / Apodo">
            
            <label for="idioma-input" style="display:block; margin-bottom:5px; font-size:0.9rem; color:#666; text-align:left; padding-left:15px;">Idioma en el que deseas leer:</label>
            
            <!-- DEJAR VACÍO: Se llenará automáticamente por código -->
            <select id="idioma-input" style="width:90%; padding:10px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc; background: white;">
            </select>

            <button id="btnEntrar">Unirse</button>
        </div>
    </div>



    <!-- Contenedor Principal de la App (Responsive Grid) -->
    <div class="contenedor-app">
        
        <!-- Barra Lateral: Lista de Usuarios Conectados -->
        <aside class="barra-lateral">
            <h3>Conectados</h3>
            <ul id="lista-usuarios"></ul>
        </aside>

        <!-- Área Central del Chat -->
        <main class="zona-chat">
            <header class="header-chat">
                <!-- Botón de menú para visualización en celulares -->
                <button id="btn-menu" class="btn-menu-movil">👥 Usuarios</button>
                <h1 id="chat-titulo">Sala Pública</h1>
                <button id="btn-volver-publico" class="oculto">Volver a Sala Pública</button>
            </header>

            <!-- Ventana de visualización de mensajes -->
            <div id="mensajes"></div>

            <!-- Indicador de Escritura -->
            <div id="indicador-escribiendo"></div>

            <!-- Entrada de Texto -->
            <div class="formulario">
                <input type="text" id="texto" placeholder="Escribe un mensaje aquí..." disabled>
                <button id="btnEnviar" disabled>Enviar</button>
            </div>
        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
