# Balanceador de carga para Agora ejecutando 2+ instancias Node detras de
# un unico punto de entrada. Ver docs/architecture.md y docs/deployment.md
# para la justificacion completa de cada decision.

worker_processes auto;
pid /tmp/agora-nginx.pid;
error_log /tmp/agora-nginx-error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log /tmp/agora-nginx-access.log;

    # ip_hash da "sticky sessions" basadas en IP de cliente: util porque el
    # transporte de Socket.IO puede usar HTTP long-polling como fallback
    # (varias peticiones HTTP cortas) antes de actualizar a WebSocket; sin
    # afinidad, esas peticiones podrian repartirse entre instancias
    # distintas a mitad del handshake y romperlo. Con el adaptador de Redis
    # ya no es estrictamente necesario para la entrega de mensajes (eso
    # funciona entre instancias sin sticky sessions), pero SI sigue siendo
    # necesario para que el handshake inicial de una misma conexion sea
    # consistente. Alternativa en produccion: forzar transports:["websocket"]
    # en el cliente y usar un balanceador L4 (sin necesidad de afinidad).
    upstream agora_backend {
        ip_hash;
        server 127.0.0.1:3000 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8080;

        location /socket.io/ {
            proxy_pass http://agora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://agora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
