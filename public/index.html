<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modal de registro: nickname + idioma -->
    <div id="modal-login" class="modal">
        <div class="modal-contenido">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu Nickname / Apodo">
            <label for="idioma-input" class="label-idioma">Idioma en el que deseas leer:</label>
            <select id="idioma-input"></select>
            <button id="btnEntrar">Unirse</button>
        </div>
    </div>

    <!-- Contenedor principal: barra lateral + zona de chat -->
    <div class="contenedor-app">

        <!-- Barra lateral: usuarios conectados y canales -->
        <aside class="barra-lateral">

            <!-- Lista de usuarios conectados -->
            <div class="seccion-usuarios">
                <h3 id="titulo-conectados">Conectados</h3>
                <ul id="lista-usuarios"></ul>
            </div>

            <!-- Lista de canales (solo el creador puede escribir) -->
            <div class="seccion-canales">
                <h3 id="titulo-canales">Canales</h3>
                <button id="btn-crear-canal">＋ Crear Canal</button>
                
                <!-- NUEVO: Formulario oculto para ingresar el nombre -->
                <div id="contenedor-crear-canal" style="display: none; margin: 10px 0;">
                    <input type="text" id="input-nombre-canal" style="width: 100%; margin-bottom: 5px;">
                    <div style="display: flex; gap: 5px;">
                        <button id="btn-confirmar-crear" style="flex: 1;">OK</button>
                        <button id="btn-cancelar-crear" style="flex: 1;">X</button>
                    </div>
                </div>

                <ul id="lista-canales"></ul>
            </div>


        </aside>

        <!-- Zona de chat (cambia entre: pública, privada y canal) -->
        <main class="zona-chat" id="zona-chat">

            <header class="header-chat">
                <button id="btn-menu" class="btn-menu-movil">Menú</button>
                <div class="contenedor-titulo-chat">
                    <h1 id="chat-titulo">Sala Pública</h1>
                </div>
                <div class="header-acciones">
                    <button id="btn-volver-publico" style="display:none;">Volver a Sala Pública</button>
                    <button id="btn-fondo" title="Personalizar fondo" class="btn-icono-fondo">🎨</button>
                </div>
            </header>

            <!-- Panel de personalización de fondo -->
            <div id="panel-fondo" class="panel-fondo oculto">
                <div class="panel-fondo-cabecera">
                    <span>Personalizar fondo</span>
                    <button id="btn-cerrar-panel-fondo" class="btn-cerrar-panel">✕</button>
                </div>
                <div class="panel-fondo-opciones">
                    <div class="opcion-fondo">
                        <label>Color sólido</label>
                        <input type="color" id="fondo-color" value="#f4f6f8">
                    </div>
                    <div class="opcion-fondo">
                        <label>Degradado</label>
                        <div class="degradado-controles">
                            <input type="color" id="fondo-grad-1" value="#a8edea">
                            <span>→</span>
                            <input type="color" id="fondo-grad-2" value="#fed6e3">
                        </div>
                        <button id="btn-aplicar-degradado" class="btn-opcion-fondo">Aplicar degradado</button>
                    </div>
                    <div class="opcion-fondo">
                        <label>Imagen (URL)</label>
                        <input type="text" id="fondo-url" placeholder="https://...">
                        <button id="btn-aplicar-url" class="btn-opcion-fondo">Aplicar imagen</button>
                    </div>
                    <div class="opcion-fondo">
                        <label>Subir imagen</label>
                        <label for="fondo-archivo" class="btn-opcion-fondo btn-subir">📁 Elegir archivo</label>
                        <input type="file" id="fondo-archivo" accept="image/*" style="display:none;">
                    </div>
                    <div class="opcion-fondo">
                        <button id="btn-restaurar-fondo" class="btn-restaurar">↺ Restaurar predeterminado</button>
                    </div>
                </div>
            </div>

            <!-- Ventana de mensajes -->
            <div id="mensajes"></div>
            <div id="indicador-escribiendo"></div>

            <!-- Entrada de texto -->
            <div class="formulario">
                <input type="text" id="texto" placeholder="Escribe un mensaje aquí..." disabled>
                <button id="btnEnviar" disabled>Enviar</button>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
