<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket Avanzado</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Modal de Registro de Usuario -->
    <div id="modal-login" class="modal">
        <div class="modal-contenido">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu Nickname / Apodo">
            <label for="idioma-input" style="display:block;margin-bottom:5px;font-size:0.9rem;color:#666;text-align:left;padding-left:15px;">
                Idioma en el que deseas leer:
            </label>
            <select id="idioma-input" style="width:90%;padding:10px;margin-bottom:15px;border-radius:4px;border:1px solid #ccc;background:white;">
            </select>
            <button id="btnEntrar">Unirse</button>
        </div>
    </div>

    <!-- Contenedor Principal Unificado -->
    <div class="contenedor-app">

        <!-- Barra Lateral Multifunción -->
        <aside class="barra-lateral">
            
           
            
            <!-- Sección de Usuarios Traducible -->
            <div class="seccion-usuarios" style="margin-top: 20px;">
                <h3 id="titulo-conectados">Conectados</h3>
                <ul id="lista-usuarios"></ul>
            </div>

             <!-- NUEVA: Sección de Canales Traducible -->
            <div class="seccion-canales">
                <h3 id="titulo-canales">Canales</h3>
                <button id="btn-crear-canal" style="width: 100%; margin-bottom: 10px;">+ Crear Canal</button>
                <ul id="lista-canales"></ul>
            </div>

        </aside>

        <!-- Zona Única de Chat -->
        <!-- data-tipo-sala: controla si es "publica", "privada" o "canal" -->
        <!-- data-creador-canal: almacena el nickname del dueño del canal activo -->
        <main class="zona-chat" id="zona-chat" data-tipo-sala="publica" data-creador-canal="">
            <header class="header-chat">
                <button id="btn-menu" class="btn-menu-movil">👥 Menú</button>
                
                <div class="contenedor-titulo-chat">
                    <h1 id="chat-titulo">Sala Pública</h1>
                    <span id="badge-privados" class="badge-privados oculto">0</span>
                </div>

                <!-- Modificado: Se quitó la clase 'oculto' nativa para manejar su visibilidad con JS (display: none/block) -->
                <button id="btn-volver-publico" style="display: none;">Volver a Sala Pública</button>
            </header>

            <!-- Ventana Única de Mensajes -->
            <div id="mensajes"></div>

            <div id="indicador-escribiendo"></div>

            <!-- Entrada de Texto Única -->
            <div class="formulario">
                <input type="text" id="texto" placeholder="Escribe un mensaje aquí..." disabled>
                <button id="btnEnviar" disabled>Enviar</button>
            </div>
        </main>

    </div>

    <script src="app.js"></script>
</body>

</html>
